# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
**Title: DONALD DUCK VS TOM — 60-SECOND EPIC FIGHT**

Generate a 60-second, ultra-high-quality 3D animated slapstick action comedy featuring Donald Duck and Tom the gray cat. Use expressive character animation, detailed feathers and fur, cinematic lighting, realistic shadows, dynamic camera movement, motion blur, dramatic slow motion, and professional animated-film rendering.

**Format:** 9:16 vertical, 1080 × 1920, 30 FPS, optimized for YouTube Shorts, TikTok, and Instagram Reels.

**Scene 1 (0–3 sec):** Start immediately with an intense face-off, dramatic bass drop, fast zoom, and a surprising opening move.

**Scene 2 (3–15 sec):** Donald throws rapid punches while Tom dodges and launches a spectacular flying kick. Add punchy impact sounds and comic reaction shots.

**Scene 3 (15–30 sec):** They chase each other through a warehouse yard, dodging wooden crates and barrels. Use dynamic tracking shots, whip pans, and exaggerated cartoon physics.

**Scene 4 (30–42 sec):** Tom briefly gains the advantage. Donald looks defeated, then notices a clever opportunity and launches a hilarious comeback.

**Scene 5 (42–52 sec):** Donald performs an unexpected finishing maneuver. Tom flies backward through a cloud of cartoon dust and lands harmlessly in a pile of empty boxes.

**Scene 6 (52–60 sec):** Donald poses triumphantly. Tom begins to rise behind him. Donald slowly turns toward the camera in shock. Freeze-frame, dramatic record scratch, and bold text: “PART 2?!”

Use consistent character designs, smooth transitions, energetic original action music, synchronized sound effects, and no graphic violence. Keep the pacing fast, with a visual surprise every few seconds. End on a seamless visual cue that can loop into the opening scene.
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
